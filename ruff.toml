target-version = "py311"
line-length = 100
src = ["src"]

exclude = [
    ".venv",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter/reviewer judgment, not hard-blocked
]

[lint.isort]
known-first-party = ["lupa_recorder"]

[format]
quote-style = "double"
indent-style = "space"
