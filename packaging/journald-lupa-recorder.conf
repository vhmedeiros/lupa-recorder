# Drop-in do journald — instalado pelo bootstrap.sh em
# /etc/systemd/journald.conf.d/lupa-recorder.conf.
#
# O gravador roda por meses numa máquina de campo sem ninguém olhando; o log não
# pode encher o disco de sistema (que é pequeno — SSD de 128GB). O que importa de
# verdade (segmentos, eventos) vive no catálogo SQLite, não no journal.

[Journal]
SystemMaxUse=500M
MaxRetentionSec=2week
