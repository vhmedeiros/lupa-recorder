[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lupa-recorder"
version = "0.1.0"
description = "Gravador autônomo de TV/rádio da plataforma Lupa — captura, catálogo e retenção, sem dependência da Lupa (Django) em runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "pillow>=10",
]

[project.scripts]
lupa-recorder = "lupa_recorder.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/lupa_recorder"]
